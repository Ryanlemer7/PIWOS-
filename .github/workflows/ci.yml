name: OWO frontend CI

on:
  push:
    branches: [owo-integration]
  pull_request:
    branches: [main, owo-integration]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
